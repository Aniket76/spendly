services:
  - type: web
    name: spendly
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app run --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
