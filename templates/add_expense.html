{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/expense_form.css') }}">
{% endblock %}

{% block content %}
<div class="expense-form-page">
    <a class="expense-form-back" href="{{ url_for('profile') }}">&larr; Back to profile</a>

    <section class="expense-form-card" aria-labelledby="expense-form-title">
        <h1 class="expense-form-title" id="expense-form-title">Add expense</h1>

        {% if error %}
        <p class="form-error" id="form-error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="post" action="{{ url_for('add_expense') }}" novalidate>
            <div class="expense-field">
                <label for="amount">Amount (₹)</label>
                <input class="expense-input" type="number" id="amount" name="amount"
                       step="0.01" min="0.01" inputmode="decimal" required
                       value="{{ values.amount or '' }}"{% if error %} aria-describedby="form-error"{% endif %}>
            </div>

            <div class="expense-field">
                <label for="category">Category</label>
                <select class="expense-input" id="category" name="category" required>
                    <option value="" disabled{% if not values.category %} selected{% endif %}>Choose a category</option>
                    {% for c in categories %}
                    <option value="{{ c }}"{% if values.category == c %} selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="expense-field">
                <label for="date">Date</label>
                <input class="expense-input" type="date" id="date" name="date"
                       max="{{ today }}" required value="{{ values.date or '' }}">
            </div>

            <div class="expense-field">
                <label for="description">Description <span class="expense-optional">(optional)</span></label>
                <input class="expense-input" type="text" id="description" name="description"
                       maxlength="200" value="{{ values.description or '' }}">
            </div>

            <div class="expense-actions">
                <button class="btn-primary expense-save" type="submit">Save expense</button>
                <a class="btn-ghost expense-cancel" href="{{ url_for('profile') }}">Cancel</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
